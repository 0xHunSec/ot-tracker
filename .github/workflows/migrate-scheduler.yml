name: Migrate cron-job.org scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: SCHEDULER_MIGRATION
    timeout-minutes: 5
    env:
      CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
      SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN || secrets.SCHEDULE_GITHUB_TOKEN }}
      CRON_JOB_ID: "8364710"
      OLD_URL: https://api.github.com/repos/team-allied-security/ot-tracker/actions/workflows/track.yml/dispatches
      NEW_URL: https://api.github.com/repos/0xHunSec/ot-tracker/actions/workflows/track.yml/dispatches

    steps:
      - name: Validate migration credentials
        shell: bash
        run: |
          for setting in CRONJOB_API_KEY SCHEDULER_GITHUB_TOKEN; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Configure ${setting} in the SCHEDULER_MIGRATION environment."
              exit 1
            fi
          done

      - name: Move and verify the scheduler
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          job_file="$(mktemp "${RUNNER_TEMP}/cron-job.XXXXXX")"
          payload_file="$(mktemp "${RUNNER_TEMP}/cron-payload.XXXXXX")"
          response_file="$(mktemp "${RUNNER_TEMP}/cron-response.XXXXXX")"
          trap 'rm -f -- "${job_file}" "${payload_file}" "${response_file}"' EXIT

          read_job() {
            curl --fail --silent --show-error \
              --output "${job_file}" \
              --header "Authorization: Bearer ${CRONJOB_API_KEY}" \
              --header "Accept: application/json" \
              "https://api.cron-job.org/jobs/${CRON_JOB_ID}"
          }

          read_job
          jq -e --argjson expected_id "${CRON_JOB_ID}" \
            '.jobDetails.jobId == $expected_id' "${job_file}" >/dev/null

          current_url="$(jq -r '.jobDetails.url // empty' "${job_file}")"
          case "${current_url}" in
            "${OLD_URL}"|"${NEW_URL}") ;;
            *)
              echo "::error::Job ${CRON_JOB_ID} points to an unexpected URL: ${current_url}"
              exit 1
              ;;
          esac

          jq -n '{
            job: {
              enabled: true,
              title: "OT Tracker - 0xHunSec/ot-tracker",
              saveResponses: false,
              url: env.NEW_URL,
              requestMethod: 1,
              extendedData: {
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": ("Bearer " + env.SCHEDULER_GITHUB_TOKEN),
                  "Content-Type": "application/json",
                  "User-Agent": "ot-tracker-cron",
                  "X-GitHub-Api-Version": "2022-11-28"
                },
                body: "{\"ref\":\"main\"}"
              }
            }
          }' >"${payload_file}"

          curl --fail --silent --show-error \
            --request PATCH \
            --output "${response_file}" \
            --header "Authorization: Bearer ${CRONJOB_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary "@${payload_file}" \
            "https://api.cron-job.org/jobs/${CRON_JOB_ID}"

          read_job
          jq -e '
            .jobDetails.enabled == true and
            .jobDetails.url == env.NEW_URL and
            .jobDetails.requestMethod == 1 and
            .jobDetails.extendedData.body == "{\"ref\":\"main\"}" and
            .jobDetails.extendedData.headers.Authorization ==
              ("Bearer " + env.SCHEDULER_GITHUB_TOKEN)
          ' "${job_file}" >/dev/null

          curl --fail --silent --show-error \
            --request POST \
            --output /dev/null \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SCHEDULER_GITHUB_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: ot-tracker-cron" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "${NEW_URL}"

          jq -r '
            "Migrated cron-job.org job \(.jobDetails.jobId) to " +
            "\(.jobDetails.url); next execution: \(.jobDetails.nextExecution)."
          ' "${job_file}"
